# Compiler settings match the pinned commonware-sol library (lib/commonware/sol/foundry.toml)
# so the verifiers compile exactly as upstream tests them.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 1000000
via_ir = true
# As upstream sol/foundry.toml: differential tests need FFI and run only in their own profile.
no_match_test = "test(Fuzz)?_Differential"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./test/vectors" }]
remappings = [
    "commonware/=lib/commonware/sol/src/",
    "forge-std/=lib/forge-std/src/",
]
# BajillionSettlement alone compiles at 200 runs so it fits EIP-170 (24,576 bytes); at 1,000,000
# runs it is 29,051 bytes. The linked verifier libraries it calls (BajillionChallenge,
# AdmissionVerifier, CertificateVerifier, PayoutVerifier, Ed25519Verifier) are separate deployed
# contracts and stay at the upstream 1,000,000 runs. SettlementSize.t.sol enforces the limit.
additional_compiler_profiles = [{ name = "settlement", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/BajillionSettlement.sol", optimizer_runs = 200 }]

[profile.default.fuzz]
runs = 1024
seed = "0x2a"

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

# Differential tests against the crate's SettlementChain through the offchain/oracle binary
# (test/Differential.t.sol). Build it first: `cargo build --release --locked -p bajillion-oracle`
# in offchain/. Inherits every compiler setting from the default profile.
[profile.differential]
ffi = true
no_match_test = "test_unused"

[profile.differential.fuzz]
runs = 1000

[fmt]
bracket_spacing = true
# Vendored code keeps its upstream formatting.
ignore = ["src/verify/vendor/**/*.sol"]

[lint]
# Style notes only. Immutables keep the crate's field names so the port reads against
# settlement.rs; struct literals mirror Rust tuple construction.
exclude_lints = ["screaming-snake-case-immutable", "named-struct-fields", "asm-keccak256"]
# Test helpers and temporary vectors are not linted.
ignore = ["test/**/*.sol", "src/verify/vendor/**/*.sol"]
